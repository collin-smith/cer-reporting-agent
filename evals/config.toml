# Eval harness config (D3). Change the test set, splits, arm or targets here, not in code.
# Targets confirmed by Collin 2026-11-03 (output/engagement-brief.md); proposed = true would mark a draft.

[run]
cases = "evals/cases/cases.jsonl"
splits = ["dev"]          # dev | test | heldout; targets are scored on heldout
arm = "workflow-nova"     # workflow-nova (live, Bedrock) | oracle (case facts straight to the rules, $0)
runs_dir = "evals/runs"
repeats = 3               # passes per live arm: Nova Lite isn't repeatable at temperature 0, so report the spread
perturb = ["noblank", "wrap72"]  # stability variants per live pass (evals.PERTURB); --no-perturb skips them

[models.nova-lite]
env = "NOVA_LITE_ARN"     # terraform output nova_lite_profile_arn (tagged profile)
region = "ca-central-1"
# USD per 1M tokens: AWS Price List, AmazonBedrock, ca-central-1, CAN1-NovaLite-*, checked 2026-11-10 (D53).
# Runs before 2026-11-10 recorded costs at 0.06 / 0.24 (exactly 15/16 of list); their results.jsonl keep those
# figures, and the articles re-cost them x16/15 (D60).
price_in = 0.064
price_out = 0.256
price_cache_read = 0.016   # 75% off input (D53)
price_cache_write = 0.0    # free on Nova Lite: the 2026-11-10 bill shows writes at $0 (D56)

[models.nova-pro]
env = "NOVA_PRO_ARN"      # terraform output nova_pro_profile_arn (tagged; US cross-region profile, no Canada one)
region = "us-east-1"
# USD per 1M tokens. Nova Pro on-demand list price (us-east-1); check against the AWS Price List before quoting costs.
price_in = 0.80
price_out = 3.20

[models.haiku-45]
env = "HAIKU45_ARN"       # terraform output haiku45_profile_arn (tagged; US system profile, D54)
region = "ca-central-1"
# USD per 1M tokens: what the bill charged for Claude Haiku 4.5 through the US profile, 10% over Anthropic's
# $1 / $5 list (Cost Explorer, 2026-11-10, D56). Used because Claude 5.5 isn't available to this account (D54).
price_in = 1.10
price_out = 5.50

[targets]
missed_reports = { max = 0, proposed = false }          # reportable cases called "not reportable"
late_deadlines = { max = 0, proposed = false }          # 3 h cases given 24 h (or none)
deadline_correct = { min = 0.95, proposed = false }
over_notify = { max = 0.30, proposed = false }           # not-reportable cases sent as reportable or precautionary
missing_recall = { min = 0.90, proposed = false }
extraction_accuracy = { min = 0.95, proposed = false }
latency_p95_s = { max = 300, proposed = false }

[assumptions]
manual_triage_minutes = 30   # proposed, not measured (engagement brief)

# The $0 eval gate (python -m cer_agent.gate, in CI): frozen runs re-scored with the current code. targets = the run
# must meet [targets]; every run must score no worse than evals/gate-baseline.json.
[gate]
runs = [
  { name = "strict-dev", run = "20261104-165709-workflow-nova-strict-dev", targets = true },
  { name = "strict-test (replay)", run = "20261104-163507-workflow-nova-test", mode = "strict-replay", targets = true },
  { name = "workflow-test", run = "20261104-163507-workflow-nova-test" },
  { name = "agent-v3-dev", run = "20261107-085533-agent-nova-dev" },
  { name = "agent-v3-test", run = "20261107-092254-agent-nova-test" },
]
