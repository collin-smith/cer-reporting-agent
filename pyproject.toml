[project]
name = "cer-reporting-agent"
version = "0.1.0"
description = "Triage pipeline-incident field reports against the CER's reporting rules: a measured multi-agent system on AWS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "strands-agents>=1.0",
    "mcp>=2.3",  # the MCP server and client (article 5); also a strands-agents dependency
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "cairosvg>=2.7",
]
langgraph = [  # article 4: the reviewing agent built a second time, in LangGraph
    "langgraph>=1.0",
    "langchain-aws>=1.0",
]
render = [
    "pillow>=11",
    "reportlab>=4.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cer_agent"]
