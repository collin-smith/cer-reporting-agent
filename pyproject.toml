[project]
name = "cer-reporting-agent"
version = "0.1.0"
description = "Triage pipeline-incident field reports against the CER's reporting rules: a measured multi-agent system on AWS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "cairosvg>=2.7",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cer_agent"]
